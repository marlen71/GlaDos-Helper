# ============================================================
#  GLaDOS Helper — основной конфиг
# ============================================================

user:
  # Как Гладос к вам обращается
  name: "Марлен"
  title: "сэр"           # сэр / мэм / "" (пусто — без обращения)
  birthday: "10.11"      # ДД.ММ — в этот день поздравит
  timezone: "Europe/Moscow"

wake:
  # Имя ассистента. Можно заменить на любое — например "Джарвис", "Пятница",
  # "Алиса", "Компьютер". Первое слово в списке считается основным.
  # Остальные — запасные варианты произношения.
  words: ["гладос", "глэдос", "glados"]
  # Похожие по звучанию слова распознаются автоматически, перечислять
  # все варианты («Лада», «Складас», «Сладость») больше не нужно.
  fuzzy: true
  # Сколько секунд после ответа можно говорить без обращения по имени
  followup_seconds: 10

stt:
  engine: "faster-whisper"
  # tiny / base / small / medium / large-v3
  # Примерная задержка ответа на процессоре:
  #   tiny ~0.4с | base ~0.7с | small ~1.5с | medium ~4с | large-v3 ~10с
  # ВАЖНО: tiny и base часто путают имя. Для надёжного распознавания
  # рекомендуется "small", а с видеокартой — "medium".
  model: "small"
  # auto / cpu / cuda. "auto" включит видеокарту, если она доступна.
  device: "auto"
  # int8 (процессор) / float16 (видеокарта) — подбирается автоматически
  compute_type: "int8"
  beam_size: 1           # 1 = быстро, 5 = точнее и медленнее
  language: "ru"
  # Номер устройства записи из mictest.bat. null = микрофон Windows по умолчанию
  device_index: null
  # Усиление тихого микрофона. 1.0 = без изменений, 2.0 = вдвое громче
  gain: 1.0

  # --- Детектор речи ---
  # Порог подстраивается под фоновый шум автоматически. Это надёжнее
  # фиксированного значения: работает и в тишине, и при включённом кулере.
  auto_threshold: true
  # Во сколько раз речь должна быть громче шума, чтобы считаться речью.
  # Не слышит вас -> уменьшите до 2.0. Реагирует на шум -> увеличьте до 4.5
  threshold_multiplier: 3.0
  # Запасной фиксированный порог, если auto_threshold: false
  vad_threshold: 0.015
  # Пауза, после которой фраза считается законченной.
  # НЕ СТАВЬТЕ МЕНЬШЕ 0.5 — иначе фраза обрывается на середине
  # и вместо «Гладос, открой Discord» распознаётся только «Гладос».
  silence_seconds: 0.8
  max_phrase_seconds: 15

tts:
  engine: "silero"       # silero / sapi (запасной вариант Windows)
  speaker: "baya"        # baya / kseniya / xenia / aidar / eugene
  sample_rate: 48000
  # --- Эффект "голос GLaDOS" ---
  glados_effect:
    enabled: true
    pitch_semitones: -1.5   # чуть ниже
    robot_depth: 0.35       # кольцевая модуляция (металл)
    robot_freq: 62          # Гц несущей
    flanger: 0.25           # лёгкий флэнжер
    reverb: 0.22            # холодное эхо лаборатории Aperture
    drive: 1.15             # мягкая перегрузка

apps:
  # Команда -> путь/URL. Поддерживаются %ENV% переменные Windows.
  browser: "start chrome"
  steam: "C:/Program Files (x86)/Steam/steam.exe"
  discord: "%LOCALAPPDATA%/Discord/Update.exe --processStart Discord.exe"
  youtube: "https://www.youtube.com"
  telegram: "%LOCALAPPDATA%/Telegram Desktop/Telegram.exe"
  explorer: "explorer.exe"
  spotify: "spotify"
  yandex_music: "%LOCALAPPDATA%/Programs/YandexMusic/Яндекс Музыка.exe"

games:
  # "как говорю" -> steam AppID (запуск через steam://rungameid/)
  "портал 2": 620
  "portal 2": 620
  "контра": 730
  "кс2": 730
  "cs2": 730
  "дота": 570
  "dota": 570
  "ведьмак 3": 292030
  "террария": 105600
  "гаррис мод": 4000
  "гарис мод": 4000
  "garry's mod": 4000
  "гмод": 4000
  "ксго": 4465480
  "кс го": 4465480
  "csgo": 4465480
  "кс 1.6": 10
  "кс 1 6": 10
  "контра 1.6": 10
  "counter-strike 1.6": 10
  # Можно указать и прямой путь к exe:
  # "майнкрафт": "C:/Games/Minecraft/launcher.exe"

power:
  shutdown_delay: 20     # сек до выключения (можно отменить: "гладос отмена")
  reboot_delay: 15
  confirm: true          # спрашивать подтверждение

storage:
  notes_file: "data/notes.md"
  reminders_file: "data/reminders.json"

log_level: "INFO"
